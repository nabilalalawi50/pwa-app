<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق Offline-First PWA</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; max-width: 600px; margin: auto; background-color: #f8fafc; color: #1e293b; }
    .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 1rem; }
    .status { padding: 0.5rem 1rem; border-radius: 9999px; font-weight: bold; display: inline-block; font-size: 0.875rem; }
    .online { background-color: #dcfce7; color: #166534; }
    .offline { background-color: #fee2e2; color: #991b1b; }
    input, button { padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    input { width: 70%; margin-left: 2%; }
    button { background-color: #2563eb; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    ul { list-style: none; padding: 0; }
    li { background: white; padding: 0.75rem; margin-top: 0.5rem; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
    .pending-tag { font-size: 0.75rem; background: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>حالة الاتصال</h2>
    <span id="connectionStatus" class="status online">متصل بالإنترنت</span>
  </div>

  <div class="card">
    <h2>إضافة بيانات</h2>
    <div style="display: flex;">
      <input type="text" id="dataInput" placeholder="أدخل بياناتك هنا...">
      <button onclick="handleSave()">حفظ</button>
    </div>
  </div>

  <div class="card">
    <h2>البيانات المخزنة</h2>
    <ul id="dataList"></ul>
  </div>

  <script>
    // 1. تسجيل الـ Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('Service Worker Registration Failed!', err));
      });
    }

    // 2. متابعة حالة الاتصال بالإنترنت
    const statusEl = document.getElementById('connectionStatus');
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusEl.textContent = 'متصل بالإنترنت';
        statusEl.className = 'status online';
        syncDataWithServer(); // مزامنة البيانات الملعقة فور عودة الاتصال
      } else {
        statusEl.textContent = 'غير متصل بالإنترنت (Offline)';
        statusEl.className = 'status offline';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // 3. إدارة IndexedDB التخزين المحلي
    let db;
    const request = indexedDB.open('OfflineAppDB', 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('records')) {
        db.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      renderList();
    };

    // 4. حفظ البيانات (سواء متصل أو غير متصل)
    function handleSave() {
      const input = document.getElementById('dataInput');
      if (!input.value.trim()) return;

      const record = {
        text: input.value,
        synced: navigator.onLine,
        createdAt: new Date().toISOString()
      };

      const tx = db.transaction('records', 'readwrite');
      const store = tx.objectStore('records');
      store.add(record);

      tx.oncomplete = () => {
        input.value = '';
        renderList();
        if (navigator.onLine) {
          syncDataWithServer();
        }
      };
    }

    // 5. عرض البيانات المخزنة محلياً
    function renderList() {
      if (!db) return;
      const tx = db.transaction('records', 'readonly');
      const store = tx.objectStore('records');
      const request = store.getAll();

      request.onsuccess = () => {
        const list = document.getElementById('dataList');
        list.innerHTML = '';
        request.result.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${item.text}</span>
            ${!item.synced ? '<span class="pending-tag">بانتظار المزامنة</span>' : ''}
          `;
          list.appendChild(li);
        });
      };
    }

    // 6. محاكاة مزامنة البيانات مع الخادم (Backend Sync)
    function syncDataWithServer() {
      if (!db) return;
      const tx = db.transaction('records', 'readwrite');
      const store = tx.objectStore('records');
      const request = store.getAll();

      request.onsuccess = () => {
        const unsyncedItems = request.result.filter(item => !item.synced);
        
        if (unsyncedItems.length === 0) return;

        console.log('جاري مزامنة البيانات غير المزامنة مع الخادم...', unsyncedItems);

        // هنا يتم إرسال طلبات fetch إلى الـ API الخارجي
        // محاكاة نجاح إرسال البيانات للـ API:
        unsyncedItems.forEach(item => {
          item.synced = true;
          store.put(item);
        });

        tx.oncomplete = () => {
          renderList();
          console.log('تمت المزامنة بنجاح!');
        };
      };
    }
  </script>
</body>
</html>
